<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sureler — Huffaz</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="loading" class="page-loading">
  <div class="spinner"></div>
  <p>Yükleniyor…</p>
</div>

<div id="app" class="hidden">
  <!-- App Bar -->
  <header class="app-bar">
    <div class="app-bar-nav-btns">
      <button class="app-bar-btn" onclick="location.href='../index.html'">← Ana Sayfa</button>
      <button class="app-bar-btn" onclick="history.back()">← Geri</button>
    </div>
    <span class="app-bar-title" style="margin-left:8px">📚 Sureler</span>
  </header>

  <main class="app-main">
    <div class="tab-top">
      <input id="sure-ara" type="search" class="search-box" placeholder="🔍 Sure ara (Bakara, 2, Rahman…)">
    </div>
    <div id="sure-listesi" class="sure-listesi"></div>
  </main>
</div>

<!-- Sure Detay Paneli -->
<div id="sure-panel" class="sure-panel hidden">
  <div class="panel-bar">
    <button id="panel-geri" class="panel-geri-btn">← Geri</button>
    <div class="panel-title-area">
      <span id="panel-tr-isim" class="panel-tr"></span>
      <span id="panel-ar-isim" class="panel-ar" dir="rtl"></span>
    </div>
    <button id="panel-sure-test" class="btn btn-gold btn-sm" style="font-weight:700;box-shadow:var(--shadow-sm);">
      🎯 Bu Sureyi Test Et
    </button>
    <div class="panel-bulk-btns">
      <button id="panel-tumunu-ekle" class="btn btn-sm btn-success">✓ Tümü</button>
      <button id="panel-tumunu-cikar" class="btn btn-sm btn-danger">✗ Kaldır</button>
    </div>
  </div>
  <div class="panel-prog-row">
    <div class="panel-prog-bar-wrap">
      <div id="panel-prog-fill" class="panel-prog-fill"></div>
    </div>
    <span id="panel-prog-text" class="panel-prog-text"></span>
  </div>
  <div id="panel-ayet-listesi" class="panel-ayet-listesi"></div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script src="../js/data.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
