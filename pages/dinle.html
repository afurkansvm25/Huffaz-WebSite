<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinle — Huffaz</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .dinle-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 16px 80px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Oynatıcı Kartı */
    .dinle-player-card {
      background: linear-gradient(145deg, #064e3b, #022c22);
      border-radius: var(--r-xl);
      padding: 24px;
      color: #fff;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
    }
    .dinle-player-card::before {
      content: '';
      position: absolute;
      top: -50px; right: -50px;
      width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(217,119,6,.2), transparent 70%);
      border-radius: 50%;
    }

    .dinle-status-badge {
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(4px);
      padding: 4px 14px;
      border-radius: var(--r-full);
      font-size: .78rem;
      font-weight: 700;
      color: var(--gold-300);
      margin-bottom: 12px;
      letter-spacing: .5px;
    }

    .dinle-live-ayah-card {
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--r-lg);
      padding: 18px 20px;
      width: 100%;
      margin: 14px 0 18px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .dinle-ayah-text-ar {
      font-family: 'Amiri', serif;
      font-size: 1.45rem;
      line-height: 2.1;
      direction: rtl;
      text-align: center;
      color: #fef08a;
      text-shadow: 0 2px 4px rgba(0,0,0,.4);
    }
    .dinle-ayah-meta {
      font-size: .8rem;
      color: rgba(255,255,255,.75);
      margin-top: 8px;
      font-weight: 600;
    }

    /* İlerleme Çubuğu */
    .dinle-progress-wrap {
      width: 100%;
      cursor: pointer;
      padding: 8px 0;
    }
    .dinle-progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,.2);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .dinle-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gold-400);
      border-radius: 4px;
      transition: width .15s linear;
    }
    .dinle-time-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      color: rgba(255,255,255,.6);
      font-weight: 600;
    }

    /* Kontrol Butonları */
    .dinle-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }
    .dinle-ctrl-btn {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all var(--t);
    }
    .dinle-ctrl-btn:hover {
      background: rgba(255,255,255,.25);
      transform: scale(1.05);
    }
    .dinle-ctrl-btn.btn-play-main {
      width: 58px; height: 58px;
      font-size: 1.5rem;
      background: var(--gold-500);
      color: #000;
      border-color: var(--gold-400);
      box-shadow: 0 4px 16px rgba(245,158,11,.4);
    }
    .dinle-ctrl-btn.btn-play-main:hover {
      background: var(--gold-400);
      transform: scale(1.08);
    }

    /* Ayarlar Kartı */
    .dinle-options-card {
      background: var(--card);
      border-radius: var(--r-xl);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .dinle-opt-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--green-950);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dinle-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .dinle-field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dinle-field-group.full-width {
      grid-column: 1 / -1;
    }
    .dinle-label {
      font-size: .82rem;
      font-weight: 700;
      color: var(--gray-700);
    }
    .dinle-select, .dinle-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--r-sm);
      border: 2px solid var(--gray-200);
      background: #fff;
      font-size: .88rem;
      outline: none;
      transition: border-color var(--t);
      font-family: inherit;
    }
    .dinle-select:focus, .dinle-input:focus {
      border-color: var(--green-600);
    }

    .range-inputs-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .range-sep {
      font-weight: 700;
      color: var(--gray-400);
    }

    @media (max-width: 640px) {
      .dinle-form-grid { grid-template-columns: 1fr; }
      .dinle-player-card { padding: 18px 14px; }
      .dinle-ayah-text-ar { font-size: 1.25rem; line-height: 1.9; }
      .dinle-controls { gap: 8px; }
      .dinle-ctrl-btn { width: 38px; height: 38px; font-size: .95rem; }
      .dinle-ctrl-btn.btn-play-main { width: 50px; height: 50px; font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div id="loading" class="page-loading">
  <div class="spinner"></div>
  <p>Yükleniyor…</p>
</div>

<div id="app" class="hidden">

  <!-- Header -->
  <header class="app-bar">
    <div class="app-bar-nav-btns">
      <button class="app-bar-btn" onclick="location.href='../index.html'">← Ana Sayfa</button>
      <button class="app-bar-btn" onclick="history.back()">← Geri</button>
    </div>
    <span class="app-bar-title" style="margin-left:8px">🎧 Kur'an Dinle</span>
  </header>

  <div class="dinle-container">

    <!-- ══ 1. OYNATICI KARTI ══ -->
    <div class="dinle-player-card">
      <div class="dinle-status-badge" id="player-status-badge">Hazır · Okuyucu Seçin</div>

      <div style="font-weight:800;font-size:1.2rem;letter-spacing:-.2px" id="player-main-title">
        Mishary Rashed Alafasy
      </div>
      <div style="font-size:.85rem;opacity:.8;margin-top:2px" id="player-sub-title">
        1. Sayfa — 10. Sayfa Aralığı
      </div>

      <!-- Canlı Ayet Metni -->
      <div class="dinle-live-ayah-card">
        <div class="dinle-ayah-text-ar" id="live-ayah-text">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَـٰنِ ٱلرَّحِيمِ</div>
        <div class="dinle-ayah-meta" id="live-ayah-meta">1. Fâtiha Suresi, 1. Ayet — Sayfa 1</div>
      </div>

      <!-- İlerleme Çubuğu -->
      <div class="dinle-progress-wrap" id="progress-container" onclick="seekAudio(event)">
        <div class="dinle-progress-bar">
          <div class="dinle-progress-fill" id="audio-progress-fill"></div>
        </div>
      </div>
      <div class="dinle-time-row">
        <span id="audio-curr-time">0:00</span>
        <span id="audio-playlist-pos">Ayet 1 / 1</span>
        <span id="audio-total-time">0:00</span>
      </div>

      <!-- Kontrol Butonları -->
      <div class="dinle-controls">
        <button class="dinle-ctrl-btn" onclick="playPrevAyah()" title="Önceki Ayet">⏮</button>
        <button class="dinle-ctrl-btn" onclick="seekRelative(-5)" title="5sn Geri">↩ 5s</button>
        <button class="dinle-ctrl-btn btn-play-main" id="btn-play-toggle" onclick="togglePlay()" title="Oynat / Duraklat">▶</button>
        <button class="dinle-ctrl-btn" onclick="seekRelative(5)" title="5sn İleri">5s ↪</button>
        <button class="dinle-ctrl-btn" onclick="playNextAyah()" title="Sonraki Ayet">⏭</button>
      </div>
    </div>

    <!-- ══ 2. AYARLAR KARTI ══ -->
    <div class="dinle-options-card">
      <div class="dinle-opt-title">🎛 Dinleme Ayarları</div>

      <div class="dinle-form-grid">
        
        <!-- Okuyucu Seçimi -->
        <div class="dinle-field-group">
          <label class="dinle-label" for="select-reciter">Okuyucu:</label>
          <select id="select-reciter" class="dinle-select" onchange="onSettingChange()">
            <option value="alafasy" selected>Mishary Rashed Alafasy (مشاري راشد العفاسي)</option>
            <option value="seferagic">Fatih Seferagic (فاتح سفرجيك)</option>
            <option value="abdulbasit">Abdulbasit Abdussamad (عبد الباسط عبد الصمد)</option>
            <option value="husary">Mahmoud Khalil Al-Husary (محمود خليل الحصري)</option>
            <option value="ghamadi">Saad Al-Ghamdi (سعد الغامدي)</option>
            <option value="minshawi">Mohamed Siddiq El-Minshawi (محمد صديق المنشاوي)</option>
          </select>
        </div>

        <!-- Dinleme Modu / Kapsamı -->
        <div class="dinle-field-group">
          <label class="dinle-label" for="select-mode">Kapsam Türü:</label>
          <select id="select-mode" class="dinle-select" onchange="onModeChange()">
            <option value="page_range" selected>Sayfa Aralığı</option>
            <option value="surah">Sure Bazında</option>
            <option value="juz">Cüz Bazında</option>
          </select>
        </div>

        <!-- Sayfa Aralığı Seçimi -->
        <div class="dinle-field-group full-width" id="grp-page-range">
          <label class="dinle-label">Sayfa Aralığı (Her iki sayfa da dahil):</label>
          <div class="range-inputs-row">
            <div style="flex:1;display:flex;align-items:center;gap:6px">
              <span style="font-size:.8rem;font-weight:600;color:var(--gray-500)">Başlangıç:</span>
              <input type="number" id="page-start" class="dinle-input" min="1" max="605" value="1" onchange="onSettingChange()">
            </div>
            <span class="range-sep">—</span>
            <div style="flex:1;display:flex;align-items:center;gap:6px">
              <span style="font-size:.8rem;font-weight:600;color:var(--gray-500)">Bitiş:</span>
              <input type="number" id="page-end" class="dinle-input" min="1" max="605" value="10" onchange="onSettingChange()">
            </div>
          </div>
        </div>

        <!-- Sure ve Ayet Aralığı Seçimi -->
        <div class="dinle-field-group full-width hidden" id="grp-surah-select">
          <label class="dinle-label" for="select-surah">Sure Seçimi:</label>
          <select id="select-surah" class="dinle-select" onchange="onSurahChange()">
            <!-- JS ile doldurulacak -->
          </select>
          <label class="dinle-label" style="margin-top:8px">Ayet Aralığı (Her iki ayet de dahil):</label>
          <div class="range-inputs-row">
            <div style="flex:1;display:flex;align-items:center;gap:6px">
              <span style="font-size:.8rem;font-weight:600;color:var(--gray-500)">Başlangıç:</span>
              <input type="number" id="surah-ayah-start" class="dinle-input" min="1" max="7" value="1" onchange="onSettingChange()">
            </div>
            <span class="range-sep">—</span>
            <div style="flex:1;display:flex;align-items:center;gap:6px">
              <span style="font-size:.8rem;font-weight:600;color:var(--gray-500)">Bitiş:</span>
              <input type="number" id="surah-ayah-end" class="dinle-input" min="1" max="7" value="7" onchange="onSettingChange()">
            </div>
          </div>
        </div>

        <!-- Cüz Seçimi -->
        <div class="dinle-field-group full-width hidden" id="grp-juz-select">
          <label class="dinle-label" for="select-juz">Cüz Seçimi:</label>
          <select id="select-juz" class="dinle-select" onchange="onSettingChange()">
            <!-- 1-30 Cüz -->
          </select>
        </div>

        <!-- Tekrar Ayarı -->
        <div class="dinle-field-group">
          <label class="dinle-label" for="select-repeat">Tekrar:</label>
          <select id="select-repeat" class="dinle-select">
            <option value="1" selected>Tekrarsız (1 Kez)</option>
            <option value="2">Ayet Başına 2x Tekrar</option>
            <option value="3">Ayet Başına 3x Tekrar</option>
            <option value="loop">Tüm Listeyi Sürekli Başa Sar</option>
          </select>
        </div>

        <!-- Oynatma Hızı -->
        <div class="dinle-field-group">
          <label class="dinle-label" for="select-speed">Oynatma Hızı:</label>
          <select id="select-speed" class="dinle-select" onchange="changePlaybackSpeed()">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1.0× (Normal)</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
        </div>

      </div>

      <div style="margin-top:20px;display:flex;gap:10px">
        <button class="btn btn-primary btn-lg" style="flex:1" onclick="startPlaybackFromBeginning()">
          ▶ Seçilen Aralığı Dinlemeye Başla
        </button>
      </div>
    </div>

  </div>

</div>

<!-- Gizli HTML5 Audio Öğesi -->
<audio id="audio-engine" preload="auto"></audio>

<!-- Toast -->
<div id="toast-container"></div>

<script src="../js/data.js"></script>
<script src="../js/page_map.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/auth.js"></script>
<script>
'use strict';

// ── Okuyucu CDN Konfigürasyonları ──
const RECITERS = {
  alafasy: {
    name: 'Mishary Rashed Alafasy',
    arName: 'مشاري راشد العفاسي',
    type: 'ayah',
    url: (s, a) => `https://everyayah.com/data/Alafasy_128kbps/${pad3(s)}${pad3(a)}.mp3`
  },
  seferagic: {
    name: 'Fatih Seferagic',
    arName: 'فاتح سفرجيك',
    type: 'surah',
    url: (s, a) => `https://download.quranicaudio.com/quran/fatih_seferagic/${pad3(s)}.mp3`
  },
  abdulbasit: {
    name: 'Abdulbasit Abdussamad',
    arName: 'عبد الباسط عبد الصمد',
    type: 'ayah',
    url: (s, a) => `https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/${pad3(s)}${pad3(a)}.mp3`
  },
  husary: {
    name: 'Mahmoud Khalil Al-Husary',
    arName: 'محمود خليل الحصري',
    type: 'ayah',
    url: (s, a) => `https://everyayah.com/data/Husary_128kbps/${pad3(s)}${pad3(a)}.mp3`
  },
  ghamadi: {
    name: 'Saad Al-Ghamdi',
    arName: 'سعد الغامدي',
    type: 'ayah',
    url: (s, a) => `https://everyayah.com/data/Ghamadi_40kbps/${pad3(s)}${pad3(a)}.mp3`
  },
  minshawi: {
    name: 'Mohamed Siddiq El-Minshawi',
    arName: 'محمد صديق المنشاوي',
    type: 'ayah',
    url: (s, a) => `https://everyayah.com/data/Minshawy_Murattal_128kbps/${pad3(s)}${pad3(a)}.mp3`
  }
};

function pad3(n) {
  return String(n).padStart(3, '0');
}

// ── Oynatıcı Durumu ──
let playlist = [];         // Çalınacak ayetler listesi
let currentIndex = 0;      // Çalınan ayetin playlist indeksi
let repeatCount = 0;       // Mevcut ayetin kaç kez çalındığı
let isPlaying = false;
let currentLoadedSurah = null;
const audio = document.getElementById('audio-engine');

function init() {
  if (typeof QURAN_DATA === 'undefined' || typeof PAGE_MAP === 'undefined') {
    $('loading').innerHTML = '<p style="color:#fff;padding:24px;text-align:center">❌ Veri yüklenemedi.</p>';
    return;
  }

  populateSurahSelect();
  populateJuzSelect();
  setupAudioListeners();

  // İlk listeyi oluştur (Sayfa 1 - 10 varsayılan)
  buildPlaylist();

  $('loading').classList.add('hidden');
  $('app').classList.remove('hidden');
}

function populateSurahSelect() {
  const sel = $('select-surah');
  sel.innerHTML = '';
  const surahs = new Map();
  QURAN_DATA.forEach(a => {
    if (!surahs.has(a.surahNo)) {
      surahs.set(a.surahNo, { no: a.surahNo, tr: a.surahTr, ar: a.surahAr });
      const opt = document.createElement('option');
      opt.value = a.surahNo;
      opt.textContent = `${a.surahNo}. ${a.surahTr} (${a.surahAr})`;
      sel.appendChild(opt);
    }
  });
}

function populateJuzSelect() {
  const sel = $('select-juz');
  sel.innerHTML = '';
  for (let j = 1; j <= 30; j++) {
    const opt = document.createElement('option');
    opt.value = j;
    opt.textContent = `${j}. Cüz (Sayfa ${juzToPage(j)} – ${juzEndPage(j)})`;
    sel.appendChild(opt);
  }
}

function onModeChange() {
  const mode = $('select-mode').value;
  $('grp-page-range').classList.toggle('hidden', mode !== 'page_range');
  $('grp-surah-select').classList.toggle('hidden', mode !== 'surah');
  $('grp-juz-select').classList.toggle('hidden', mode !== 'juz');
  if (mode === 'surah') {
    onSurahChange();
  } else {
    onSettingChange();
  }
}

function onSurahChange() {
  const sNo = parseInt($('select-surah').value) || 1;
  const surahAyahs = QURAN_DATA.filter(a => a.surahNo === sNo);
  const total = surahAyahs.length;
  const inStart = $('surah-ayah-start');
  const inEnd = $('surah-ayah-end');
  inStart.min = 1;
  inStart.max = total;
  inStart.value = 1;
  inEnd.min = 1;
  inEnd.max = total;
  inEnd.value = total;
  onSettingChange();
}

function onSettingChange() {
  buildPlaylist();
}

// ── Çalma Listesi Oluşturma ──
function buildPlaylist() {
  const mode = $('select-mode').value;
  let ayahs = [];

  if (mode === 'page_range') {
    let pStart = parseInt($('page-start').value) || 1;
    let pEnd   = parseInt($('page-end').value) || 1;
    if (pStart > pEnd) [pStart, pEnd] = [pEnd, pStart];
    pStart = Math.max(1, Math.min(605, pStart));
    pEnd   = Math.max(1, Math.min(605, pEnd));

    for (let p = pStart; p <= pEnd; p++) {
      const pageAyahs = PageHelper.ayahsForPage(p > 604 ? 604 : p);
      ayahs.push(...pageAyahs);
    }
    // Benzersizleştir
    const seen = new Set();
    ayahs = ayahs.filter(a => {
      const k = `${a.surahNo}:${a.ayahNo}`;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });

    $('player-sub-title').textContent = `${pStart}. Sayfa — ${pEnd}. Sayfa Aralığı (${ayahs.length} Ayet)`;

  } else if (mode === 'surah') {
    const sNo = parseInt($('select-surah').value) || 1;
    const allSurahAyahs = QURAN_DATA.filter(a => a.surahNo === sNo);
    const total = allSurahAyahs.length;
    let aStart = parseInt($('surah-ayah-start').value) || 1;
    let aEnd   = parseInt($('surah-ayah-end').value) || total;
    if (aStart > aEnd) [aStart, aEnd] = [aEnd, aStart];
    aStart = Math.max(1, Math.min(total, aStart));
    aEnd   = Math.max(1, Math.min(total, aEnd));

    ayahs = allSurahAyahs.filter(a => a.ayahNo >= aStart && a.ayahNo <= aEnd);
    const sName = allSurahAyahs.length ? allSurahAyahs[0].surahTr : '';
    $('player-sub-title').textContent = `${sNo}. ${sName} Suresi (${aStart}. — ${aEnd}. Ayetler)`;

  } else if (mode === 'juz') {
    const jNo = parseInt($('select-juz').value) || 1;
    const pStart = juzToPage(jNo);
    const pEnd   = juzEndPage(jNo);
    for (let p = pStart; p <= pEnd; p++) {
      const pageAyahs = PageHelper.ayahsForPage(p > 604 ? 604 : p);
      ayahs.push(...pageAyahs);
    }
    const seen = new Set();
    ayahs = ayahs.filter(a => {
      const k = `${a.surahNo}:${a.ayahNo}`;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
    $('player-sub-title').textContent = `${jNo}. Cüz (${ayahs.length} Ayet)`;
  }

  playlist = ayahs;
  currentIndex = 0;
  repeatCount = 0;

  const reciterKey = $('select-reciter').value;
  const reciter = RECITERS[reciterKey] || RECITERS.alafasy;
  $('player-main-title').textContent = reciter.name;

  if (playlist.length > 0) {
    updateLiveView(playlist[0]);
  }
}

function updateLiveView(ayah) {
  if (!ayah) return;
  $('live-ayah-text').textContent = getCleanAyahText(ayah);
  const pNo = pageForAyah(ayah.surahNo, ayah.ayahNo);
  $('live-ayah-meta').textContent = `${ayah.surahNo}. ${ayah.surahTr} (${ayah.surahAr}), ${ayah.ayahNo}. Ayet — Sayfa ${pNo}`;
  $('audio-playlist-pos').textContent = `Ayet ${currentIndex + 1} / ${playlist.length}`;
}

// ── Ses Kontrolleri ve Oynatma ──
function setupAudioListeners() {
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    $('audio-progress-fill').style.width = `${pct}%`;
    $('audio-curr-time').textContent = formatTime(audio.currentTime);
    $('audio-total-time').textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => {
    handleAyahEnded();
  });

  audio.addEventListener('play', () => {
    isPlaying = true;
    $('btn-play-toggle').textContent = '⏸';
    $('player-status-badge').textContent = '▶ Çalıyor';
  });

  audio.addEventListener('pause', () => {
    isPlaying = false;
    $('btn-play-toggle').textContent = '▶';
    $('player-status-badge').textContent = '⏸ Duraklatıldı';
  });

  audio.addEventListener('error', (e) => {
    console.warn('Audio error:', e);
    $('player-status-badge').textContent = '⚠️ Ses yüklenemedi (Sonrakine geçiliyor…)';
    setTimeout(() => playNextAyah(), 1200);
  });
}

function formatTime(sec) {
  if (isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function startPlaybackFromBeginning() {
  buildPlaylist();
  currentIndex = 0;
  repeatCount = 0;
  loadAndPlayAyah(currentIndex);
}

function loadAndPlayAyah(index) {
  if (!playlist || index < 0 || index >= playlist.length) return;
  currentIndex = index;
  const ayah = playlist[currentIndex];
  updateLiveView(ayah);

  const reciterKey = $('select-reciter').value;
  const reciter = RECITERS[reciterKey] || RECITERS.alafasy;

  if (reciter.type === 'surah') {
    const audioUrl = reciter.url(ayah.surahNo, ayah.ayahNo);
    if (currentLoadedSurah !== ayah.surahNo || audio.src !== audioUrl) {
      currentLoadedSurah = ayah.surahNo;
      audio.src = audioUrl;
      changePlaybackSpeed();
      audio.play().catch(e => {
        console.log('Autoplay blocked or stream issue:', e);
      });
    }
  } else {
    currentLoadedSurah = null;
    const audioUrl = reciter.url(ayah.surahNo, ayah.ayahNo);
    audio.src = audioUrl;
    changePlaybackSpeed();
    audio.play().catch(e => {
      console.log('Autoplay blocked or stream issue:', e);
    });
  }
}

function togglePlay() {
  if (!playlist.length) buildPlaylist();
  if (audio.paused) {
    if (!audio.src || audio.src === window.location.href) {
      loadAndPlayAyah(currentIndex);
    } else {
      audio.play();
    }
  } else {
    audio.pause();
  }
}

function handleAyahEnded() {
  const reciterKey = $('select-reciter').value;
  const reciter = RECITERS[reciterKey] || RECITERS.alafasy;
  const repSetting = $('select-repeat').value;
  const maxRepeat = parseInt(repSetting) || 1;

  if (reciter.type === 'surah') {
    // Sure bazlı okuyucuda sonraki sureye geç
    const currentAyah = playlist[currentIndex];
    const nextIdx = playlist.findIndex((a, idx) => idx > currentIndex && a.surahNo !== currentAyah.surahNo);
    if (nextIdx !== -1) {
      loadAndPlayAyah(nextIdx);
    } else if (repSetting === 'loop') {
      loadAndPlayAyah(0);
    } else {
      $('player-status-badge').textContent = '✓ Dinleme Tamamlandı';
      isPlaying = false;
      $('btn-play-toggle').textContent = '▶';
    }
    return;
  }

  if (repSetting !== 'loop' && repeatCount + 1 < maxRepeat) {
    // Aynı ayeti tekrar çal
    repeatCount++;
    audio.currentTime = 0;
    audio.play();
  } else {
    // Sonraki ayete geç
    repeatCount = 0;
    if (currentIndex + 1 < playlist.length) {
      loadAndPlayAyah(currentIndex + 1);
    } else if (repSetting === 'loop') {
      loadAndPlayAyah(0); // Başa sar
    } else {
      $('player-status-badge').textContent = '✓ Dinleme Tamamlandı';
      isPlaying = false;
      $('btn-play-toggle').textContent = '▶';
    }
  }
}

function playNextAyah() {
  if (currentIndex + 1 < playlist.length) {
    repeatCount = 0;
    loadAndPlayAyah(currentIndex + 1);
  }
}

function playPrevAyah() {
  if (audio.currentTime > 2) {
    audio.currentTime = 0;
  } else if (currentIndex > 0) {
    repeatCount = 0;
    loadAndPlayAyah(currentIndex - 1);
  }
}

function seekRelative(deltaSec) {
  if (!audio.duration) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + deltaSec));
}

function seekAudio(e) {
  const bar = $('progress-container');
  const rect = bar.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const pct = Math.max(0, Math.min(1, clickX / rect.width));
  if (audio.duration) {
    audio.currentTime = pct * audio.duration;
  }
}

function changePlaybackSpeed() {
  const speed = parseFloat($('select-speed').value) || 1;
  audio.playbackRate = speed;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
